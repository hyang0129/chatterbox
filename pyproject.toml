[project]
name = "chatterbox-server"
version = "0.1.0"
description = "Dev container for Chatterbox Turbo TTS inference"
requires-python = ">=3.11"
dependencies = [
    "chatterbox-tts>=0.1.6",
    "fastapi>=0.115.0",
    "soundfile>=0.12.0",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
# Default run covers only mocked unit tests.
# GPU integration tests live in integration/ and must be invoked explicitly:
#   pytest tests/integration/ -v -s
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = ["gpu: requires a CUDA-capable NVIDIA GPU"]
